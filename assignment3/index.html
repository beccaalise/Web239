<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Rebecca Cathey">
    <title>Random Cat Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
    
<body>
  <header>
    <h1>Random Cat Generator</h1>
    <p>Need a little happiness? Generate some random cats!</p>
  </header>
  
  <main>
    <section class="controls">
        <label for="cat-count">How many cats would you like to see?></label>
        
        <select id="cat-count">
            <option value="1" selected>1 Cat</option>
            <option value="3">3 Cats</option>
            <option value="5">5 Cats!</option>
            <option value="10">10 Cats!</option>
        </select>

        <button id="generate-btn">Generate Cat(s)!</button>
    </section>

      <section id="cat-gallery" aria-live="polite">
          <!-- Cat images and information will go here -->
      </section>
  </main>
</body>
</html>
